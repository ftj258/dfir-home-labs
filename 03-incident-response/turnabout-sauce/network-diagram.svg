<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 862" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="greyArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a97a8"/>
    </marker>
    <marker id="greyArrowBoth" markerWidth="10" markerHeight="10" refX="4" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6f7d8f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="862" fill="#fbfbf9"/>

  <!-- Title -->
  <text x="40" y="48" font-size="26" font-weight="700" fill="#2a2a2a">C137.local — the attacker's path in</text>
  <text x="40" y="76" font-size="15" fill="#6b6b6b">Three VMs on 10.42.85.0/24. The router left RDP open to the internet. That was the door.</text>

  <!-- INTERNET zone -->
  <rect x="40" y="110" width="290" height="180" rx="14" fill="#f4f1ea" stroke="#cfc9ba" stroke-dasharray="6 5"/>
  <text x="58" y="136" font-size="14" font-weight="700" fill="#8a7f66" letter-spacing="1">INTERNET</text>

  <rect x="58" y="150" width="254" height="56" rx="9" fill="#ffffff" stroke="#d8d3c7"/>
  <text x="72" y="174" font-size="16" font-weight="700" fill="#2a2a2a">194.61.24.102</text>
  <text x="72" y="194" font-size="12.5" fill="#6b6b6b">Moscow, RU — entry + malware host</text>

  <rect x="58" y="214" width="254" height="56" rx="9" fill="#ffffff" stroke="#d8d3c7"/>
  <text x="72" y="238" font-size="16" font-weight="700" fill="#2a2a2a">203.78.103.109</text>
  <text x="72" y="258" font-size="12.5" fill="#6b6b6b">Bangkok, TH — command &amp; control</text>

  <!-- open door arrow INTERNET -> ROUTER -->
  <line x1="330" y1="190" x2="486" y2="190" stroke="#c0392b" stroke-width="4" marker-end="url(#redArrow)"/>
  <text x="338" y="178" font-size="12.5" font-style="italic" fill="#c0392b">the open door</text>

  <!-- ROUTER -->
  <rect x="490" y="158" width="190" height="66" rx="10" fill="#ffffff" stroke="#b9b1a0"/>
  <text x="585" y="186" font-size="15.5" font-weight="700" fill="#2a2a2a" text-anchor="middle">Router / gateway</text>
  <text x="585" y="207" font-size="13.5" fill="#6b6b6b" text-anchor="middle">10.42.85.100</text>
  <!-- RDP open tag -->
  <rect x="505" y="122" width="208" height="26" rx="13" fill="#f7e4e1" stroke="#c0392b"/>
  <text x="609" y="139" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">RDP 3389 open to the internet</text>

  <!-- step 1 badge on the door -->
  <circle cx="408" cy="190" r="13" fill="#c0392b"/>
  <text x="408" y="195" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>

  <!-- upstream DNS -->
  <rect x="770" y="158" width="188" height="60" rx="10" fill="#ffffff" stroke="#d8d3c7"/>
  <text x="864" y="182" font-size="14" font-weight="700" fill="#2a2a2a" text-anchor="middle">Upstream DNS</text>
  <text x="864" y="202" font-size="12.5" fill="#6b6b6b" text-anchor="middle">192.168.45.1</text>
  <line x1="636" y1="372" x2="806" y2="220" stroke="#8a97a8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#greyArrow)"/>
  <text x="742" y="300" font-size="11.5" fill="#8a97a8" transform="rotate(-41 742 300)">DNS forward</text>

  <!-- router down to internal net -->
  <line x1="585" y1="224" x2="585" y2="356" stroke="#8a97a8" stroke-width="2" marker-end="url(#greyArrow)"/>

  <!-- INTERNAL NETWORK band -->
  <rect x="360" y="356" width="600" height="150" rx="14" fill="#eef1f4" stroke="#cfd6de"/>
  <text x="378" y="382" font-size="13.5" font-weight="700" fill="#5d6b7d">Internal network — 10.42.85.0/24</text>

  <!-- DC (patient zero) -->
  <rect x="402" y="398" width="232" height="92" rx="11" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="518" y="426" font-size="16" font-weight="700" fill="#2a2a2a" text-anchor="middle">CITADEL-DC01  (DC)</text>
  <text x="518" y="447" font-size="13.5" fill="#6b6b6b" text-anchor="middle">10.42.85.10</text>
  <text x="518" y="469" font-size="12" fill="#c0392b" text-anchor="middle">patient zero · DNS · C:\FileShare</text>
  <!-- DC attack badges 2,3 -->
  <circle cx="414" cy="398" r="13" fill="#c0392b"/><text x="414" y="403" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <circle cx="446" cy="398" r="13" fill="#c0392b"/><text x="446" y="403" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>

  <!-- DESKTOP -->
  <rect x="700" y="398" width="232" height="92" rx="11" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="816" y="426" font-size="16" font-weight="700" fill="#2a2a2a" text-anchor="middle">DESKTOP-SDN1RPT</text>
  <text x="816" y="447" font-size="13.5" fill="#6b6b6b" text-anchor="middle">10.42.85.115</text>
  <text x="816" y="469" font-size="12" fill="#6b6b6b" text-anchor="middle">Z: mapped drive</text>
  <!-- desktop attack badges 5,6 -->
  <circle cx="712" cy="398" r="13" fill="#c0392b"/><text x="712" y="403" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <circle cx="744" cy="398" r="13" fill="#c0392b"/><text x="744" y="403" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>

  <!-- lateral link DC <-> desktop -->
  <line x1="634" y1="444" x2="700" y2="444" stroke="#c0392b" stroke-width="2.5" marker-end="url(#redArrow)"/>
  <circle cx="667" cy="444" r="13" fill="#c0392b"/><text x="667" y="449" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>

  <!-- LEGEND -->
  <text x="40" y="552" font-size="16" font-weight="700" fill="#2a2a2a">How the attack moved</text>
  <g font-size="13.5" fill="#333">
    <circle cx="52" cy="580" r="11" fill="#c0392b"/><text x="52" y="584.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="72" y="585">Nmap scan, then brute-force RDP from 194.61.24.102 into the DC (95 fails, the 96th worked).</text>

    <circle cx="52" cy="610" r="11" fill="#c0392b"/><text x="52" y="614.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="72" y="615">DC downloads coreupdater.exe over HTTP from 194.61.24.102.</text>

    <circle cx="52" cy="640" r="11" fill="#c0392b"/><text x="52" y="644.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="72" y="645">DC calls home to the C2 at 203.78.103.109:443.</text>

    <circle cx="52" cy="670" r="11" fill="#c0392b"/><text x="52" y="674.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="72" y="675">Attacker RDPs from the DC to the desktop, reusing the stolen Administrator login.</text>

    <circle cx="52" cy="700" r="11" fill="#c0392b"/><text x="52" y="704.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="72" y="705">Desktop downloads the same malware and calls the same C2.</text>

    <circle cx="52" cy="730" r="11" fill="#c0392b"/><text x="52" y="734.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text>
    <text x="72" y="735">loot.zip (~128 KB) leaves the desktop for the C2.</text>
  </g>

  <!-- her-voice annotation -->
  <line x1="40" y1="768" x2="960" y2="768" stroke="#e2ddd2"/>
  <text x="40" y="796" font-size="13.5" font-style="italic" fill="#5d6b7d">The victim is the whole C137.local network. The DC was patient zero, the desktop came next. The router wasn't hacked — it was just left open.</text>
</svg>
